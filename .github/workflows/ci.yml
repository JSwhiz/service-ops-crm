name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create backend env file
        run: |
          cat > .env.backend.local <<'EOF'
          NODE_ENV=development
          APP_ENV=ci
          APP_NAME=Service Ops CRM
          APP_BASE_URL=http://localhost:3000
          BACKEND_PORT=4000
          DATABASE_URL=postgresql://service_ops:service_ops_password@127.0.0.1:55432/service_ops?schema=public
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=ci_access_secret
          JWT_REFRESH_SECRET=ci_refresh_secret
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=30d
          MINIO_ENDPOINT=localhost
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadminpassword
          MINIO_BUCKET=service-ops-files
          EOF

      - name: Create frontend env file
        run: |
          cat > .env.frontend.local <<'EOF'
          NEXT_PUBLIC_APP_NAME=Service Ops CRM
          NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
          EOF

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        run: pnpm --filter frontend build
