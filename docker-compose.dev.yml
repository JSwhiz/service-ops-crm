services:
  postgres:
    image: postgres:16
    container_name: service_ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_ops
      POSTGRES_USER: service_ops
      POSTGRES_PASSWORD: service_ops_password
    ports:
      - "55432:5432"
    volumes:
      - service_ops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_ops -d service_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: service_ops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - service_ops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: service_ops_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - service_ops_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  service_ops_postgres_data:
  service_ops_redis_data:
  service_ops_minio_data:
